<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malik Autoz – Motorcycle spare parts</title>
<meta name="description" content="Pick your motorcycle, check price and stock, then send your order on WhatsApp.">
<meta property="og:title" content="Malik Autoz – Motorcycle spare parts">
<meta property="og:description" content="Pick your bike, add the parts you need and send the order on WhatsApp.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0F1F24">
<style>
:root{
  --paper:#F4F1E8; --surface:#FFFFFF; --ink:#0B2530; --ink-2:#4C6874; --line:#DDE2E0;
  --amber:#E8A93B; --ok:#0B7A4B; --low:#A85300; --out:#B3261E; --wa:#0B7A43;
  --navy:#0E2A38; --navy2:#123246;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--font)}
html[lang="ur"] body{font-family:var(--font-ur);line-height:1.9}
body.has-bar{padding-bottom:92px}
:focus-visible{outline:3px solid #1B5FD6;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.num{direction:ltr;unicode-bidi:isolate}

/* owner-only warnings */
.owner{background:#FFF3CD;border-bottom:1px solid #E6C86E;padding:10px 16px;font:14px/1.4 var(--font);color:#4A3800;direction:ltr;text-align:left}
.owner p{margin:2px 0}

/* header */
.top{position:relative;background:linear-gradient(155deg,var(--navy) 0%,var(--navy2) 60%,#0A2029 100%);color:#fff;padding:14px 0 20px}
.top::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:14px;opacity:.85}
.top-actions{display:flex;gap:8px}
.pill{min-height:40px;padding:0 14px;border-radius:8px;border:2px solid rgba(255,255,255,.7);color:#fff;background:transparent;font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.pill.wa{background:var(--wa);border-color:var(--wa)}

/* bike picker */
.picker{padding-block:24px 12px}
.picker h2{margin:0 0 14px;font-size:clamp(24px,5vw,32px);line-height:1.25;font-weight:800;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:48px;padding:0 16px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--amber)}
.chip .n{font-weight:600;font-size:13px;color:var(--ink-2)}
.chip.plain{border-style:dashed;font-weight:650}

/* search + filters */
.tools{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0;border-bottom:1px solid var(--line)}
.tools .wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 260px}
.search input{width:100%;min-height:48px;padding:0 14px;border:2px solid var(--ink);border-radius:8px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:650;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--ink)}
.count{margin:16px 0 0;color:var(--ink-2);font-size:14px;font-weight:650;scroll-margin-top:96px}

/* part rows */
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;column-gap:40px}
@media (min-width:820px){.list{grid-template-columns:1fr 1fr}}
.part{padding:16px 0;border-bottom:1px solid var(--line)}
.row1{display:flex;gap:12px;align-items:flex-start}
.thumb{width:76px;height:76px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#E3E9EA;flex:none}
.body{flex:1;min-width:0}
.pname{margin:0;font-size:17px;font-weight:750;line-height:1.35}
.fits{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.fits b{color:var(--ink);font-weight:650}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;border:1px solid var(--line);padding:1px 7px;border-radius:4px;color:var(--ink-2);background:var(--surface)}
.pr{text-align:end;flex:none}
.price{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.price.ask{font-size:14px;font-weight:650;color:var(--ink-2)}
.stock{font-size:13px;font-weight:650;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.stock.in{color:var(--ok)} .stock.low{color:var(--low)} .stock.out{color:var(--out)}
.row2{display:flex;align-items:center;gap:16px;margin-top:10px;flex-wrap:wrap}

/* buttons */
.btn{min-height:44px;padding:0 18px;border:0;border-radius:8px;font:inherit;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.add{background:var(--amber);color:var(--ink)}
.btn.add:hover{filter:brightness(.95)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0 2px;min-height:44px;display:inline-flex;align-items:center;font:inherit;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.step{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.step button{width:44px;height:40px;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:22px;font-weight:700;cursor:pointer}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step output{min-width:40px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

.state{padding:36px 0;text-align:center;color:var(--ink-2)}
.state p{margin:0 auto 12px;max-width:44ch}
#more{padding:20px 0;text-align:center}

footer{margin-top:40px;padding:24px 0 32px;border-top:1px solid var(--line);color:var(--ink-2);font-size:14px}
footer p{margin:4px 0}

/* order bar */
.bar{position:fixed;inset-inline:0;bottom:0;z-index:10;background:var(--ink);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-info{font-weight:700;line-height:1.3}
.bar-info small{display:block;font-weight:600;font-size:14px;opacity:.85}

/* order sheet */
dialog{border:0;padding:0;width:100%;max-width:none;margin:auto 0 0;border-radius:16px 16px 0 0;background:var(--surface);color:var(--ink);overflow:hidden}
dialog::backdrop{background:rgba(15,31,36,.55)}
@media (min-width:640px){dialog{width:min(560px,calc(100% - 32px));margin:auto;border-radius:16px}}
dialog[open]{animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(20px);opacity:0}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.sheet{display:flex;flex-direction:column;max-height:92vh;max-height:92dvh}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:20px;font-weight:800}
.sheet-body{overflow:auto;padding:0 16px 16px;flex:1}
.lines{list-style:none;margin:0;padding:0}
.line{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.l-name{font-weight:750}
.l-fits{font-size:13px;color:var(--ink-2)}
.l-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.l-total{font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.sum{display:flex;justify-content:space-between;padding:14px 0 6px;font-size:18px;font-weight:800}
.note{font-size:14px;color:var(--ink-2);margin:0 0 16px}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:14px;font-weight:650;margin-bottom:4px}
.field input,.field textarea{width:100%;padding:10px 12px;min-height:46px;border:2px solid var(--ink);border-radius:8px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
fieldset.pay{border:0;margin:0 0 12px;padding:0}
fieldset.pay legend{font-size:14px;font-weight:650;margin-bottom:4px;padding:0}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.opt input{width:20px;height:20px;accent-color:var(--ink)}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-foot .btn{width:100%}
.err{color:var(--out);font-weight:650;margin:0 0 8px;min-height:1.4em}

/* logo, watermark, contact, photos */
.brand{display:flex;align-items:center;gap:12px}
.logo{background:#fff;border-radius:10px;padding:4px;display:inline-flex;flex:none}
.logo img{width:46px;height:46px;object-fit:contain;display:block}
#wm{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.05}
#wm img{width:200px;max-width:45vw;height:auto}
#wm .wm-text{font-weight:800;font-size:34px;letter-spacing:4px;margin-top:8px;color:var(--ink);white-space:nowrap}
main,footer{position:relative;z-index:1}
.top{z-index:1}
.contact{margin-bottom:18px}
.contact h2{margin:0 0 8px;font-size:18px;font-weight:800;color:var(--ink)}
.crow{display:flex;flex-wrap:wrap;gap:2px 12px;padding:6px 0;border-bottom:1px solid var(--line)}
.crow .k{min-width:120px;color:var(--ink-2);font-size:13px;font-weight:650}
.crow .v{font-weight:600;color:var(--ink)}
.crow a{color:var(--ink);text-underline-offset:3px}
.thumbbtn{border:0;padding:0;background:none;cursor:zoom-in;flex:none;line-height:0;border-radius:6px;position:relative;overflow:hidden}
.artbadge{position:absolute;inset-inline:0;bottom:0;background:rgba(15,31,36,.72);color:#fff;font:600 10px/1.5 var(--font);text-align:center;line-height:1.6}
dialog.photo .muted{margin:0 0 10px;color:var(--ink-2);font-size:13px;font-weight:400}
dialog.photo{width:min(92vw,560px);margin:auto;border-radius:12px;padding:12px;text-align:center}
dialog.photo img{width:100%;height:auto;max-height:68vh;object-fit:contain;border-radius:8px;background:#E3E9EA;display:block}
dialog.photo p{margin:10px 0;font-weight:700}
.brandrow{margin-top:18px}
.brandrow h3{margin:0 0 8px;font-size:15px;font-weight:750;color:var(--ink-2)}
.chips.small .chip{min-height:40px;padding:0 14px;font-size:15px}
.field select{width:100%;min-height:46px;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
#recv-options .opt{align-items:center}

/* compact order sheet */
#sheet{font-size:14px}
#sheet .sheet-head{padding:9px 14px}
#sheet .sheet-head h2{font-size:16px}
#sheet .sheet-head .btn{min-height:34px;padding:0 14px;font-size:13px;border-width:1.5px}
#sheet .sheet-body{padding:0 14px 10px}
#sheet .line{padding:9px 0;gap:10px}
#sheet .l-name{font-size:14px;font-weight:650}
#sheet .l-fits{font-size:12px}
#sheet .l-total{font-size:13px;margin-top:2px}
#sheet .step{border-width:1.5px}
#sheet .step button{width:34px;height:30px;font-size:17px}
#sheet .step output{min-width:30px;font-size:14px}
#sheet .linkbtn{font-size:12px;min-height:28px}
#sheet .sum{padding:9px 0 3px;font-size:15px}
#sheet .note{font-size:12px;margin:0 0 10px}
#sheet .field{margin:0 0 9px}
#sheet .field span{font-size:12px;margin-bottom:3px}
#sheet .field input,#sheet .field textarea,#sheet .field select{font-size:14px;min-height:38px;padding:6px 10px;border-width:1.5px;border-radius:7px}
#sheet fieldset.pay{margin:0 0 9px}
#sheet fieldset.pay legend{font-size:12px;margin-bottom:2px}
#sheet .opt{font-size:14px;font-weight:500;min-height:32px;gap:8px}
#sheet .opt input{width:17px;height:17px}
#sheet .sheet-foot{padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
#sheet .sheet-foot .btn{min-height:42px;font-size:15px}
#sheet .err{font-size:12.5px;margin:0 0 6px}
@media (pointer:coarse){#sheet .field input,#sheet .field textarea,#sheet .field select{font-size:16px}}   /* keeps phones from zooming in on focus */

/* Names of Allah */
.allah-wrap{position:relative;z-index:1;margin-top:10px}
.allah{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--amber);border-radius:9px;padding:7px 12px 8px}
.allah-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.allah-top h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2);text-transform:uppercase}
html[lang="ur"] .allah-top h2{letter-spacing:0;text-transform:none;font-size:13px}
.allah-no{font-size:12px;color:var(--ink-2);font-weight:650;direction:ltr}
.allah-body{transition:opacity .4s;text-align:center}
.allah-body.swap{opacity:0}
.allah-body p{margin:0}
.allah-ar{font-family:"Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic","Geeza Pro","Segoe UI",serif;font-size:24px;line-height:1.35;color:var(--ink)}
.allah-tr{font-size:12.5px;font-weight:750;font-family:var(--font)}
.allah-mean{display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;gap:0 8px;margin-top:2px;font-size:12px}
.allah-mean .sep{color:var(--ink-2)}
#allah-en,.allah-desc:not(.ur){font-family:var(--font)}
#allah-ur,.allah-desc.ur{font-family:var(--font-ur);line-height:1.9}
#allah-ur{font-size:16px}
.allah-desc{font-size:10.5px;color:var(--ink-2);margin-top:1px}
.allah-desc.ur{font-size:11.5px}
@media (prefers-reduced-motion:reduce){.allah-body{transition:none}}
.tabbar{display:none}
@media (max-width:760px){
  .tabbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--navy);
    padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 14px rgba(0,0,0,.28)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;
    border:0;background:none;color:#9FB6BF;font:inherit;font-size:11px;font-weight:650;cursor:pointer}
  .tabbar button svg{width:22px;height:22px;stroke:#9FB6BF;fill:none;stroke-width:1.8}
  .tabbar button.active{color:var(--amber)}
  .tabbar button.active svg{stroke:var(--amber)}
  .tabbar .tcart{position:relative}
  .tabbar .tn{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 3px;border-radius:8px;
    background:var(--amber);color:var(--navy);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .picker{padding-bottom:28px}
  #bar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  #help-banner-wrap{position:fixed;inset-inline:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:16;margin:0}
  #help-banner-wrap .help-banner{margin:0;border-radius:0}
  body.has-bar #help-banner-wrap{display:none}
  body.has-help-fixed{padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}
}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 6px}
@media (max-width:480px){.catgrid{grid-template-columns:repeat(3,1fr)}}
.cattile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;position:relative}
.cattile img{width:34px;height:34px}
.cattile span{font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.cattile .n{position:absolute;top:6px;right:6px;font-size:10px;font-weight:800;color:var(--ink-2)}

.cattile[aria-pressed="true"]{border-color:var(--amber);background:#FBF1DE;border-width:2px}

#chips.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
#chips .chip{flex-direction:column;align-items:flex-start;gap:2px;min-height:82px;padding:12px 14px;position:relative;font-size:14px}
#chips .chip .bikebadge{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
#chips .chip .bikebadge svg{width:24px;height:24px}
#chips .chip[aria-pressed="true"]{background:var(--amber)}
#chips .chip[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;font-size:13px;font-weight:800;
  width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center}
#chips .chip.plain{flex-direction:row;align-items:center;min-height:48px}
#chips .chip.plain .bikeicon{display:none}


/* hero header */
.top.hero .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:4px 0 2px}
.top.hero .logo{width:88px;height:88px;border-radius:50%;padding:0;background:radial-gradient(circle at 50% 35%,#fff 0%,#EAF0F1 72%);
  box-shadow:0 8px 20px rgba(0,0,0,.28);margin-bottom:6px}
.top.hero .logo img{width:100%;height:100%;object-fit:contain;padding:9px;box-sizing:border-box}
.top.hero .brand h1{font-size:24px}
.top.hero .brand p{font-size:14px;margin-bottom:8px}
.top.hero .top-actions{justify-content:center;margin-top:4px}

/* promo banner: bike-icon callout linking to the bike picker */
.promo{display:flex;align-items:center;gap:14px;margin:16px 0 0;padding:16px 18px;border-radius:14px;border:0;width:100%;
  cursor:pointer;font:inherit;text-align:start;background:linear-gradient(120deg,var(--amber),#F2C066);color:var(--ink)}
.promo svg{width:44px;height:44px;flex:none}
.promo .ptext{flex:1}
.promo .ptext b{display:block;font-size:16px;font-weight:800}
.promo .ptext span{display:block;font-size:13px;opacity:.8;margin-top:1px}
.promo .parrow{font-size:20px;font-weight:800}

/* help banner: WhatsApp callout */
.help-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0;padding:14px 16px;
  border-radius:14px;background:var(--wa);color:#fff}
.help-banner p{margin:0;font-size:14px;font-weight:700;line-height:1.3}
.help-banner .btn{background:#fff;color:var(--wa);min-height:40px;padding:0 16px;font-size:14px;flex:none}

</style>
</head>
<body>

<div id="wm" aria-hidden="true"><img id="wm-img" alt="" hidden><div class="wm-text" id="wm-text"></div></div>

<div id="owner" class="owner" hidden></div>

<header class="top hero">
  <div class="wrap">
    <div class="brand">
      <span class="logo" id="logo-wrap" hidden><img id="logo-img" alt=""></span>
      <div>
        <h1 id="shop-name">Malik Autoz</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <div class="top-actions">
      <button id="lang" class="pill" type="button"></button>
      <a id="call" class="pill" href="#" hidden data-i18n="call"></a>
      <a id="chat" class="pill wa" href="#" target="_blank" rel="noopener" data-i18n="chat"></a>
    </div>
  </div>
</header>

<main>
  <div class="wrap allah-wrap" id="allah-wrap" hidden>
    <section class="allah" aria-labelledby="allah-h">
      <div class="allah-top"><h2 id="allah-h" data-i18n="allahTitle"></h2><span class="allah-no num" id="allah-no"></span></div>
      <div class="allah-body" id="allah-body" aria-live="off">
        <p class="allah-ar" id="allah-ar" lang="ar" dir="rtl"></p>
        <p class="allah-tr" id="allah-tr" dir="ltr"></p>
        <p class="allah-mean"><span id="allah-en" lang="en" dir="ltr"></span><span class="sep" aria-hidden="true">•</span><span id="allah-ur" lang="ur" dir="rtl"></span></p>
        <p class="allah-desc" id="allah-den" lang="en" dir="ltr"></p>
        <p class="allah-desc ur" id="allah-dur" lang="ur" dir="rtl"></p>
      </div>
    </section>

function svgEl(str){ const d = document.createElement('div'); d.innerHTML = str; return d.firstElementChild; }
function h(tag, attrs){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v == null || v === false) continue;
    if(k === 'class') el.className = v;
    else if(k === 'text') el.textContent = v;
    else if(k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
    else if(v === true) el.setAttribute(k,'');
    else el.setAttribute(k, v);
  }
  for(let i=2;i<arguments.length;i++){
    const kid = arguments[i];
    if(kid == null || kid === false) continue;
    el.append(kid);
  }
  return el;
}

    name: String(r.name).trim(), models, universal, bikeKeys: models.map(bikeKey), brandKey: r.company ? bikeKey(r.company) : '', catKey: r.category ? bikeKey(r.category) : '',
    company: r.company ? String(r.company) : '', grade: r.grade ? String(r.grade) : '', category: r.category ? String(r.category) : '',
    code: r.code ? String(r.code) : '', image: r.image ? String(r.image) : '',
    price, stock, status, maxQty, canOrder: status !== 'out' && price !== null,
    hay, compact: hay.replace(/[\s\-_.]+/g,'')
  };
}
function buildBikes(){
  const map = new Map();
  for(const it of state.items) it.models.forEach((m, idx) => {
    const k = it.bikeKeys[idx];
    if(!map.has(k)) map.set(k, { key:k, label:m, count:0 });
    map.get(k).count++;
  });
  state.bikes = [...map.values()].sort((a,b) => b.count - a.count || a.label.localeCompare(b.label));
}
const CAT_ART = { engineparts:'piston', electrical:'lightning', bodyparts:'cover', brakes:'brake_shoe', 'tyres&tubes':'tyre', 'oils&lubricants':'bottle', other:'hardware' };
function buildCats(){
  const map = new Map();
  for(const it of state.items){
    if(!it.catKey) continue;
    if(!map.has(it.catKey)) map.set(it.catKey, { key:it.catKey, label:'', count:0 });
    const c = map.get(it.catKey); c.count++; if(!c.label) c.label = it.category;
  }
  state.cats = [...map.values()].sort((a,b) => b.count - a.count || a.label.localeCompare(b.label));
}
function buildBrands(){
  const map = new Map();
  for(const it of state.items){
    if(!it.brandKey) continue;
    if(!map.has(it.brandKey)) map.set(it.brandKey, { key:it.brandKey, label:it.company.trim(), count:0 });
    map.get(it.brandKey).count++;
  }
  state.brands = [...map.values()].sort((a,b) => b.count - a.count || a.label.localeCompare(b.label));
}
async function load(){
  showState('loading');
  try{
    const res = await fetch(CONFIG.catalogUrl, { cache:'no-cache' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const arr = Array.isArray(data) ? data : data.items;
    if(!Array.isArray(arr)) throw new Error('bad format');
    state.items = arr.map(normalize).filter(Boolean);
    byId = new Map(state.items.map(i => [i.id, i]));
    state.updated = (!Array.isArray(data) && data.updated) || '';
    state.sample = !Array.isArray(data) && !!data._sample;
    state.loaded = true;
    buildBikes(); buildBrands(); buildCats(); pruneCart();
    hideState(); renderChips(); renderBrands(); renderCatGrid(); renderList(); renderFooter(); updateBar(); renderOwner();
  }catch(e){
    showState('error');
  }
}

/* ===== Filtering ===== */
function filtered(){
  const toks = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rank = s => s === 'out' ? 1 : 0;
  return state.items.filter(it => {
    if(state.bike && !(it.universal || it.bikeKeys.includes(state.bike))) return false;
    if(state.brand && it.brandKey !== state.brand) return false;
    if(state.cat && it.catKey !== state.cat) return false;
    if(state.inStockOnly && it.status === 'out') return false;
    return toks.every(tk => it.hay.includes(tk) || it.compact.includes(tk.replace(/[\s\-_.]+/g,'')));
  }).sort((a,b) => rank(a.status) - rank(b.status) || a.name.localeCompare(b.name));
}

/* ===== Product photos =====
   A part's photo is simply a file named after its SKU inside the img/ folder
   (img/ENG-0001.webp, or .jpg). Nothing needs to be re-exported when a photo is
   added. Rows are checked only when they scroll near the screen. */
let photoObserver = null;
function probe(src, ok, fail){
  const im = new Image();
  im.onload = () => ok(im);
  im.onerror = () => { if(fail) fail(); };
  im.src = src;
}
function photoSources(it){
  if(it.image) return [it.image];
  if(!it.code) return [];
  const base = CONFIG.photoBase + encodeURIComponent(it.code);
  return [base + '.webp', base + '.jpg'];
}
function showPhoto(row, it, src){
  const r1 = row.querySelector('.row1');
  if(!r1 || r1.querySelector('.thumbbtn')) return;
  const img = h('img', { class:'thumb', src, alt:'', width:'76', height:'76', decoding:'async' });
  const btn = h('button', { class:'thumbbtn', type:'button', 'aria-label':t('viewPhoto', { name:it.name }),
                            onclick:() => openPhoto(src, it.name) }, img);
  r1.insertBefore(btn, r1.firstChild);
}
function showArt(row, it){
  if(CONFIG.showIllustrations === false || !window.PartArt) return;
  const r1 = row.querySelector('.row1');
  if(!r1 || r1.querySelector('.thumbbtn')) return;
  const key = PartArt.keyFor(it.name, it.category);
  const img = h('img', { class:'thumb', src:PartArt.dataUri(key), alt:'', width:'76', height:'76', decoding:'async' });
  const btn = h('button', { class:'thumbbtn art', type:'button', 'aria-label':t('viewIllus', { name:it.name }),
                            onclick:() => openPhoto(PartArt.dataUri(key, true), it.name, true) }, img, h('span', { class:'artbadge', text:t('illus') }));
  r1.insertBefore(btn, r1.firstChild);
}
function loadPhoto(row){
  const it = byId.get(row.dataset.id); if(!it) return;
  const srcs = photoSources(it); let i = 0;
  const next = () => { if(i >= srcs.length){ showArt(row, it); return; } const src = srcs[i++]; probe(src, () => showPhoto(row, it, src), next); };
  next();
}
function observePhotos(){
  if(photoObserver) photoObserver.disconnect();
  const rows = document.querySelectorAll('#list .part');
  if(!('IntersectionObserver' in window)){ rows.forEach(loadPhoto); return; }
  photoObserver = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ photoObserver.unobserve(e.target); loadPhoto(e.target); } });
  }, { rootMargin:'300px' });
  rows.forEach(r => photoObserver.observe(r));
}
function openPhoto(src, name, isArt){
  $('#photo-img').src = src; $('#photo-cap').textContent = name;
  const note = $('#photo-note'); note.hidden = !isArt; note.textContent = isArt ? t('illusNote') : '';
  $('#photo').showModal();
}

/* ===== Names of Allah: one name at a time, changing every few minutes ===== */
let allahTimer = null, allahShown = -1;
function allahStep(){ return Math.max(1, Number(CONFIG.namesMinutes) || 5) * 60000; }
function allahIndex(){ return Math.floor(Date.now() / allahStep()) % window.ASMA_UL_HUSNA.length; }
function showAllah(animate){
  const list = window.ASMA_UL_HUSNA, i = allahIndex();
  if(i === allahShown) return;
  const body = $('#allah-body');
  const fill = () => {
    const n = list[i];
    $('#allah-ar').textContent = n[0]; $('#allah-tr').textContent = n[1];
    $('#allah-en').textContent = n[2]; $('#allah-ur').textContent = n[3];
    $('#allah-den').textContent = n[4]; $('#allah-dur').textContent = n[5];
    $('#allah-no').textContent = (i + 1) + ' / ' + list.length;
    allahShown = i; body.classList.remove('swap');
  };
  if(animate && allahShown !== -1 && !matchMedia('(prefers-reduced-motion: reduce)').matches){ body.classList.add('swap'); setTimeout(fill, 400); }
  else fill();
}
function scheduleAllah(){
  clearTimeout(allahTimer);
  const step = allahStep();
  allahTimer = setTimeout(() => { showAllah(true); scheduleAllah(); }, step - (Date.now() % step) + 30);
}
function initAllah(){
  const list = window.ASMA_UL_HUSNA;
  if(CONFIG.namesOfAllah === false || !Array.isArray(list) || !list.length) return;
  $('#allah-wrap').hidden = false;
  showAllah(false); scheduleAllah();
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ showAllah(false); scheduleAllah(); } });
}

/* ===== Cart ===== */
function loadCart(){
  try{
    const arr = JSON.parse(lsGet(LS.cart) || '[]');
    if(Array.isArray(arr)) for(const p of arr) if(Array.isArray(p) && p.length === 2 && Number(p[1]) > 0) state.cart.set(String(p[0]), Math.floor(Number(p[1])));
  }catch(e){}
}
function saveCart(){ lsSet(LS.cart, JSON.stringify([...state.cart])); }
function pruneCart(){
  for(const [id, q] of [...state.cart]){
    const it = byId.get(id);
    if(!it || !it.canOrder) state.cart.delete(id);
    else state.cart.set(id, Math.min(q, it.maxQty));
  }
  saveCart();
}
function setQty(id, q){
  const it = byId.get(id); if(!it) return;
  const ae = document.activeElement;
  const role = ae && ae.dataset ? ae.dataset.role : '';
  const inSheet = !!(ae && ae.closest && ae.closest('#sheet'));

  q = Math.max(0, Math.min(it.maxQty, q));
  if(q) state.cart.set(id, q); else state.cart.delete(id);
  saveCart();

  const ctl = document.querySelector('.ctl[data-id="' + CSS.escape(id) + '"]');
  if(ctl) fillCtl(ctl, it);
  updateBar();
  if($('#sheet').open) renderSheet();

  if(role){
    const scope = inSheet ? '#lines [data-id="' + CSS.escape(id) + '"]' : '.ctl[data-id="' + CSS.escape(id) + '"]';
    const root = document.querySelector(scope);
    const target = root && (root.querySelector('[data-role="' + (role === 'add' ? 'inc' : role) + '"]:not(:disabled)') || root.querySelector('[data-role]:not(:disabled)'));
    if(target) target.focus(); else if(inSheet) $('#sheet-title').focus();
  }
}
function cartTotals(){
  let qty = 0, total = 0;
  for(const [id, q] of state.cart){ const it = byId.get(id); if(it){ qty += q; total += it.price * q; } }
  return { qty, total };
}
function updateBar(){
  const { qty, total } = cartTotals();
  $('#bar').hidden = qty === 0;
  document.body.classList.toggle('has-bar', qty > 0);
  $('#bar-count').textContent = t('inOrder', { n:qty });
  $('#bar-total').textContent = money(total);
  const tn = $('#tabcartn'); if(tn){ tn.hidden = qty === 0; tn.textContent = String(qty); }
  syncHelpFixed();
}
function syncHelpFixed(){
  const hb = $('#help-banner-wrap');
  document.body.classList.toggle('has-help-fixed', !!hb && !hb.hidden && !document.body.classList.contains('has-bar'));
}

  const ul = $('#lines'); ul.replaceChildren();

    ul.append(h('li', { class:'line', 'data-id':id },

      h('div', { class:'l-side' }, stepper(it, q),
        h('div', { class:'l-total num', text:money(it.price * q) }),
        h('button', { class:'linkbtn', type:'button', 'data-role':'remove', onclick:() => setQty(id, 0), text:t('remove') }))));
  }
  $('#total').textContent = money(cartTotals().total);
  if(!state.cart.size && $('#sheet').open) $('#sheet').close();
}
function openSheet(){
  if(!state.cart.size) return;
  renderSheet(); $('#err').textContent = '';
  $('#sheet').showModal();
}
function customer(){
  const pay = document.querySelector('input[name="pay"]:checked');
  return { name:$('#f-name').value.trim(), phone:$('#f-phone').value.trim(), bike:$('#f-bike').value.trim(), city:$('#f-city').value.trim(),
           address:$('#f-address').value.trim(), pay: pay ? pay.value : '',
           recv: state.recv, date: $('#f-date').value, win: $('#f-win').value };
}
function saveCustomer(){ const c = customer(); delete c.date; lsSet(LS.cust, JSON.stringify(c)); }
function restoreCustomer(){
  try{
    const c = JSON.parse(lsGet(LS.cust) || '{}');
    $('#f-name').value = c.name || ''; $('#f-phone').value = c.phone || ''; $('#f-bike').value = c.bike || '';
    $('#f-city').value = c.city || ''; $('#f-address').value = c.address || '';
    const r = document.querySelector('input[name="pay"][value="' + c.pay + '"]'); if(r) r.checked = true;
    state.recv = RECEIVE.some(o => o.id === c.recv) ? c.recv : '';
    state.win = c.win || '';
  }catch(e){}
}

/* how the customer wants to receive the order */
function recvOpt(){ return RECEIVE.find(o => o.id === state.recv) || null; }
function renderRecv(){
  const box = $('#recv-options'); box.replaceChildren();
  RECEIVE.forEach(o => box.append(h('label', { class:'opt' },
    h('input', { type:'radio', name:'recv', value:o.id, checked: state.recv === o.id,
                 onchange:() => { state.recv = o.id; saveCustomer(); applyRecv(); } }),
    h('span', { text: state.lang === 'ur' ? (o.ur || o.en) : o.en }))));
  const sel = $('#f-win'); const keep = state.win || sel.value;
  sel.replaceChildren(h('option', { value:'', text:'—' }));
  WINDOWS.forEach((w, i) => sel.append(h('option', { value:String(i), text: state.lang === 'ur' ? (w.ur || w.en) : w.en })));
  sel.value = keep || '';
  applyRecv();
}
function applyRecv(){
  const o = recvOpt();
  $('#addr-fields').hidden = !(o && o.address);
  $('#delivery-note').hidden = !!(o && !o.address);
  const when = o ? (o.when || 'none') : 'none';
  $('#recv-when').hidden = when === 'none';
  const opt = when === 'optional' ? ' ' + t('whenOptional') : '';
  $('#when-date-label').textContent = t('fWhenDate') + opt;
  $('#when-win-label').textContent = t('fWhenTime') + opt;
  const note = o ? (state.lang === 'ur' ? (o.note_ur || o.note_en || '') : (o.note_en || '')) : '';
  const n = $('#recv-note'); n.textContent = note; n.hidden = !note;
}
function renderPay(){
  const num = epNumber();
  $('#ep-opt').hidden = !num;
  const lab = $('#ep-label'); lab.replaceChildren(t('payEasypaisa') + ' ', h('bdi', { text:num }), CONFIG.easypaisaName ? ' – ' + CONFIG.easypaisaName : '');
  applyPay();
}
function applyPay(){
  const r = document.querySelector('input[name="pay"]:checked'), n = $('#pay-note');
  const on = !!(r && r.value === 'easypaisa' && epNumber());
  n.hidden = !on; n.textContent = on ? t('payEpNote', { n:epNumber() }) : '';
}

function orderText(f){
  const o = recvOpt();
  const L = ['Assalam o Alaikum, I would like to order from ' + CONFIG.shopName + ':', ''];
  let n = 1, total = 0;
  for(const [id, q] of state.cart){
    const it = byId.get(id); if(!it) continue;
    const lt = it.price * q; total += lt;
    L.push(n++ + '. ' + it.name + (it.models.length ? ' (' + it.models.join(', ') + ')' : '') + (it.code ? ' [' + it.code + ']' : '') + ' x' + q + ' = ' + money(lt));
  }
  L.push('', 'Parts total: ' + money(total), '', 'Name: ' + f.name, 'Contact: ' + f.phone);
  if(f.bike) L.push('My bike: ' + f.bike);
  L.push('Receive: ' + (o ? o.en : ''));
  if(o && o.address){ if(f.city) L.push('City: ' + f.city); L.push('Address: ' + f.address); }
  if(o && (o.when || 'none') !== 'none' && (f.date || f.win !== '')){
    let d = '';
    if(f.date){ try{ d = new Date(f.date + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }); }catch(e){ d = f.date; } }
    const w = (f.win !== '' && WINDOWS[Number(f.win)]) ? WINDOWS[Number(f.win)].en : '';
    L.push('Preferred time: ' + [d, w].filter(Boolean).join(', '));
  }
  const pickup = !!(o && !o.address);
  L.push('Payment: ' + (f.pay === 'easypaisa' ? 'Easypaisa (' + epNumber() + ')' : PAY_EN.shop), '',
         (pickup ? 'Please confirm availability.' : 'Please confirm availability and delivery charges.') + ' (Sent from the website catalog)');
  return L.join('\n');
}
function sendOrder(){
  const f = customer(); const err = $('#err'); const o = recvOpt();
  if(!f.name){ err.textContent = t('needName'); $('#f-name').focus(); return; }
  if(!f.phone){ err.textContent = t('needPhone'); $('#f-phone').focus(); return; }
  if((f.phone.match(/\d/g) || []).length < 10){ err.textContent = t('badPhone'); $('#f-phone').focus(); return; }
  if(!o){ err.textContent = t('needReceive'); const r = document.querySelector('input[name="recv"]'); if(r) r.focus(); return; }
  if(o.address && !f.address){ err.textContent = t('needAddress'); $('#f-address').focus(); return; }
  if(o.when === 'required' && (!f.date || f.win === '')){ err.textContent = t('needWhen'); (f.date ? $('#f-win') : $('#f-date')).focus(); return; }
  if(!f.pay){ err.textContent = t('needPay'); const pr = document.querySelector('input[name="pay"]'); if(pr) pr.focus(); return; }
  if(!(CONFIG.whatsapp || '').replace(/\D/g,'')){ err.textContent = t('noNumber'); return; }
  err.textContent = '';
  saveCustomer();
  const a = h('a', { href:waLink(orderText(f)), target:'_blank', rel:'noopener' });
  document.body.append(a); a.click(); a.remove();
}

/* ===== Language ===== */
function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.setAttribute('placeholder', t(el.dataset.i18nPh)));
  const lb = $('#lang');
  lb.textContent = state.lang === 'ur' ? 'English' : 'اردو';
  lb.setAttribute('lang', state.lang === 'ur' ? 'en' : 'ur');
}
function setLang(l){
  state.lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ur' ? 'rtl' : 'ltr';
  lsSet(LS.lang, l);
  applyStatic();
  renderContact();
  renderRecv();
  renderPay();
  if(state.loaded){ renderChips(); renderBrands(); renderCatGrid(); renderList(); renderFooter(); if($('#sheet').open) renderSheet(); }
  else if($('#state').dataset.kind) showState($('#state').dataset.kind);
  updateBar();
}

/* ===== Boot ===== */
function init(){
  $('#shop-name').textContent = CONFIG.shopName;
  document.title = CONFIG.shopName + ' – Motorcycle spare parts';
  setupBrand();
  initAllah();
  $('#chat').setAttribute('href', waLink('Assalam o Alaikum, I have a question about a spare part.'));
  $('#help-chat').setAttribute('href', waLink('Assalam o Alaikum, I need help finding a part.'));
  $('#help-banner-wrap').hidden = !(CONFIG.whatsapp || '').replace(/\D/g, '');
  syncHelpFixed();
  const saved = lsGet(LS.lang);
  state.lang = (saved === 'ur' || saved === 'en') ? saved : ((navigator.language || '').toLowerCase().indexOf('ur') === 0 ? 'ur' : 'en');
  loadCart(); restoreCustomer();

  $('#lang').addEventListener('click', () => setLang(state.lang === 'ur' ? 'en' : 'ur'));
  let timer;
  $('#q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value; state.page = 1; renderList(); }, 120); });
  $('#instock').addEventListener('change', e => { state.inStockOnly = e.target.checked; state.page = 1; renderList(); });
  $('#review').addEventListener('click', openSheet);
  $('#close').addEventListener('click', () => $('#sheet').close());
  $('#sheet').addEventListener('click', e => { if(e.target === $('#sheet')) $('#sheet').close(); });
  $('#send').addEventListener('click', sendOrder);
  $('#clear').addEventListener('click', () => { state.cart.clear(); saveCart(); document.querySelectorAll('.ctl[data-id]').forEach(c => { const it = byId.get(c.dataset.id); if(it) fillCtl(c, it); }); updateBar(); $('#sheet').close(); });
  ['f-name','f-phone','f-bike','f-city','f-address'].forEach(id => $('#' + id).addEventListener('input', saveCustomer));
  document.querySelectorAll('input[name="pay"]').forEach(r => r.addEventListener('change', () => { saveCustomer(); applyPay(); }));
  $('#f-win').addEventListener('change', e => { state.win = e.target.value; saveCustomer(); });
  $('#f-date').min = new Date().toISOString().slice(0, 10);

  setLang(state.lang);
  renderOwner();
  document.getElementById('photo-close').addEventListener('click', () => $('#photo').close());
  $('#photo').addEventListener('click', e => { if(e.target === $('#photo')) $('#photo').close(); });
  load();
}
init();
})();
</script>
</body>
